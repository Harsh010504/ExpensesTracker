<!DOCTYPE html>
<html>
<head>
<title>Expense Tracker</title>
<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
}
.container {
    width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}
input, button {
    margin: 5px;
    padding: 8px;
}
ul {
    list-style: none;
    padding: 0;
}
li {
    background: #e8f5e9;
    margin: 5px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<h2>Expense Tracker</h2>

<div class="container">
    <input id="amount" placeholder="Amount"><br>
    <input id="category" placeholder="Category"><br>
    <input id="person" placeholder="Person"><br>
    <input id="place" placeholder="Place"><br>

    <button onclick="addExpense()">Add</button>

    <h3 id="total">Total: ₹0</h3>

    <ul id="list"></ul>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function save() {
    localStorage.setItem("expenses", JSON.stringify(expenses));
}

function addExpense() {
    let amt = document.getElementById("amount").value;
    let cat = document.getElementById("category").value;
    let per = document.getElementById("person").value;
    let pla = document.getElementById("place").value;

    if(!amt) return alert("Enter amount");

    expenses.push({amt, cat, per, pla});
    save();
    display();
}

function deleteExpense(i) {
    expenses.splice(i,1);
    save();
    display();
}

function display() {
    let list = document.getElementById("list");
    let total = 0;
    list.innerHTML = "";

    expenses.forEach((e,i) => {
        total += Number(e.amt);
        list.innerHTML += `
        <li>
        ${e.per} | ${e.cat} | ${e.pla} | ₹${e.amt}
        <button onclick="deleteExpense(${i})">X</button>
        </li>`;
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}

display();
</script>

</body>
</html>
