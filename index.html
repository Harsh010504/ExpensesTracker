<!DOCTYPE html>
<html>
<head>
<title>Expense Tracker</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    position: relative;
    margin: 0;
}

/* ₹ Background */
body::before {
    content: "₹";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 250px;
    color: rgba(0, 150, 0, 0.08);
    z-index: 0;
}

.container {
    width: 400px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    position: relative;
    z-index: 1;
}

input, button {
    margin: 6px;
    padding: 8px;
    width: 85%;
}

button {
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: darkgreen;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #e8f5e9;
    margin: 6px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
    border-radius: 6px;
}
</style>
</head>

<body>

<h2>Expense Tracker</h2>

<div class="container">
    <input id="amount" placeholder="Amount"><br>
    <input id="category" placeholder="Category"><br>
    <input id="person" placeholder="Person"><br>
    <input id="place" placeholder="Place"><br>

    <button onclick="addExpense()">Add</button>

    <h3 id="total">Total: ₹0</h3>

    <ul id="list"></ul>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function save() {
    localStorage.setItem("expenses", JSON.stringify(expenses));
}

function addExpense() {
    let amt = document.getElementById("amount").value;
    let cat = document.getElementById("category").value;
    let per = document.getElementById("person").value;
    let pla = document.getElementById("place").value;

    if(!amt) return alert("Enter amount");

    expenses.push({amt, cat, per, pla});
    save();
    display();

    document.getElementById("amount").value = "";
    document.getElementById("category").value = "";
    document.getElementById("person").value = "";
    document.getElementById("place").value = "";
}

function deleteExpense(i) {
    expenses.splice(i,1);
    save();
    display();
}

function display() {
    let list = document.getElementById("list");
    let total = 0;
    list.innerHTML = "";

    expenses.forEach((e,i) => {
        total += Number(e.amt);
        list.innerHTML += `
        <li>
        ${e.per} | ${e.cat} | ${e.pla} | ₹${e.amt}
        <button onclick="deleteExpense(${i})">X</button>
        </li>`;
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}

display();
</script>

</body>
</html>
